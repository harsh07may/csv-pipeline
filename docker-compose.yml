services:
  # Express: HTTP endpoints + live progress (SSE)
  api:
    container_name: api
    build: { context: ./backend, target: dev }
    # Apply database migrations first, then start the server. Only the api migrates, so the
    # worker never races it; the worker starts after the database is healthy.
    command: sh -c "npm run migrate && npm run dev:api"
    env_file:
      - .env
    ports: ["8000:8000"]
    volumes:
      - ./backend/src:/code/src # your edits appear inside the container; tsx watch restarts
    depends_on:
      postgres: { condition: service_healthy } # wait until the database accepts connections
      garage: { condition: service_started }
      redis: { condition: service_started }

  # Postgres: jobs, orders and rejected rows
  postgres:
    container_name: postgres
    image: postgres:17-alpine
    environment:
      # Filled in from .env, so the database and the app share one set of credentials.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Garage: S3-compatible blob storage
  garage:
    container_name: garage
    image: dxflrs/garage:v2.3.0
    # --single-node: set up a one-node cluster layout automatically.
    # --default-bucket: create the bucket and access key below (and grant the key access).
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      # Filled in from .env, so Garage and the app share one set of credentials.
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET}
    ports:
      - "3900:3900" # S3 API (the browser uploads here via pre-signed URLs)
      - "3903:3903" # admin API + /metrics
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  # Community web UI for Garage
  garage-webui:
    container_name: garage-webui
    image: khairul169/garage-webui:latest
    environment:
      API_BASE_URL: http://garage:3903 # Garage admin API (token is read from garage.toml)
      S3_ENDPOINT_URL: http://garage:3900
      CONFIG_PATH: /etc/garage.toml
    ports: ["3909:3909"]
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
    depends_on: [garage]

  # Redis: pub/sub for live progress + RQ queue for background jobs
  redis:
    container_name: redis
    image: redis:7-alpine
    ports: ["6379:6379"]

  # Jaeger: collects traces from the api and the worker, and shows them at http://localhost:16686
  jaeger:
    container_name: jaeger
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "16686:16686" # trace UI. The apps send spans to jaeger:4318 (OTLP over HTTP) inside the network.

  # Background worker: pulls jobs from the "csv" queue (see backend/src/worker/index.ts)
  worker:
    build: { context: ./backend, target: dev }
    command: npm run dev:worker
    env_file:
      - .env
    volumes:
      - ./backend/src:/code/src
    depends_on:
      postgres: { condition: service_healthy }
      garage: { condition: service_started }
      redis: { condition: service_started }

volumes:
  garage-meta:
  garage-data:
  postgres-data:
